name: Android CI (APK Build)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 자바 환경 세팅
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. ✨ [핵심 치트키] 깨진 파일 무시하고, 정식 Gradle 환경을 알아서 다운로드 및 자동 조립
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2' # 우리가 적어둔 버전과 일치시킴

      # 3. 깨끗하게 정비된 환경에서 빌드 명령 수행
      - name: Build with Gradle
        run: gradle assembleDebug # 뒤에 gradlew 대신 순정 gradle 명령어로 직접 빌드합니다.

      # 4. 완성된 APK 업로드
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
