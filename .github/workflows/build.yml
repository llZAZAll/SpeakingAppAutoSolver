name: Android CI (APK Build)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 자바 환경 세팅
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Gradle 환경 자동 세팅
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # 2-5. Vosk 영어 모델 다운로드 + assets 배치 + uuid 파일 생성
      - name: Download Vosk model
        run: |
          curl -L -o vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk.zip
          mkdir -p app/src/main/assets/vosk-model-en
          cp -r vosk-model-small-en-us-0.15/* app/src/main/assets/vosk-model-en/
          echo "speakingapp-vosk-en-0.15" > app/src/main/assets/vosk-model-en/uuid
          echo "=== 모델 파일 목록 ==="
          ls -la app/src/main/assets/vosk-model-en/

      # 3. 빌드
      - name: Build with Gradle
        run: gradle assembleDebug

      # 3-5. APK 파일명을 앱명으로 변경 (이 이름만 바꾸면 됩니다)
      - name: Rename APK
        run: |
          mv "app/build/outputs/apk/debug/app-debug.apk" "app/build/outputs/apk/debug/Speaking App Auto Solver.apk"

      # 4. 완성된 APK 업로드
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpeakingAppAutoSolver
          path: "app/build/outputs/apk/debug/Speaking App Auto Solver.apk"
