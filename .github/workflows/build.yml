name: Android CI (APK Build)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 # v3에서 v4로 업데이트

      - name: set up JDK 17
        uses: actions/setup-java@v4 # v3에서 v4로 업데이트
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4 # ❌ 이 부분이 v3여서 에러가 났던 것입니다. v4로 변경!
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
