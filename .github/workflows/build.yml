name: Android CI (APK Build)

on:
  push:
    branches: [ "main" ] # 코드가 main 브랜치에 올라가면 자동 실행

jobs:
  build:
    runs-on: ubuntu-latest # 우분투 서버에서 빌드

    steps:
      - uses: actions/checkout@v3

      # 1. 자바 환경 세팅 (안드로이드 빌드에 필요)
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 2. 그래들 파일에 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 3. 디버그용 APK 빌드 (명령어 한 줄로 끝!)
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 4. 빌드된 APK 파일을 다운로드 링크로 출력
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v3
        with:
          name: app-debug.apk # 다운로드될 파일명
          path: app/build/outputs/apk/debug/app-debug.apk # 서버 내 파일 경로
